services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_parser
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/resume_parser
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-dev-secret
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run prisma:generate && npm run dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resume_parser
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/resume_parser
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
    depends_on:
      - postgres

volumes:
  postgres-data:
